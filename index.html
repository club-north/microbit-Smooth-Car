<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="
width=device-width,
initial-scale=1,
user-scalable=no">

<title>
micro:bit FPV Smooth Car
</title>

<style>

body{
    margin:0;
    background:#000814;
    color:white;
    font-family:sans-serif;
    text-align:center;
}

h1{
    font-size:48px;
    margin:20px;
}

#video{

    width:94%;
    max-height:420px;

    margin-top:10px;

    border-radius:25px;

    background:black;

    object-fit:cover;
}

#status{

    margin:20px;

    padding:20px;

    background:#09142f;

    border-radius:25px;

    font-size:36px;

    color:#44ff88;
}

#connectBtn{

    width:94%;
    height:110px;

    border:none;

    border-radius:30px;

    background:#2563eb;

    color:white;

    font-size:45px;
}

.control-grid{

    display:grid;

    grid-template-columns:
    1fr 1fr 1fr;

    grid-template-rows:
    170px 170px;

    gap:20px;

    padding:20px;

    align-items:center;
}

.ctrl{

    width:100%;
    height:170px;

    border:none;

    border-radius:35px;

    background:#2b52d4;

    color:white;

    font-size:85px;

    touch-action:none;
}

#up{
    grid-column:2;
}

#left{
    grid-column:1;
    grid-row:2;
}

#down{
    grid-column:2;
    grid-row:2;
}

#right{
    grid-column:3;
    grid-row:2;
}

#stop{

    width:92%;
    height:150px;

    border:none;

    border-radius:35px;

    background:#e11d48;

    color:white;

    font-size:60px;

    margin-top:10px;
}

.speed-title{

    font-size:50px;

    margin-top:35px;
}

#speedValue{

    font-size:70px;

    margin-top:10px;
}

.speed-row{

    display:flex;

    gap:20px;

    padding:20px;
}

.speed-btn{

    flex:1;

    height:120px;

    border:none;

    border-radius:30px;

    background:#0f172a;

    color:white;

    font-size:70px;
}

#slider{

    width:92%;

    margin-top:10px;
}

.ab-row{

    display:flex;

    gap:20px;

    padding:20px;
}

.ab-btn{

    flex:1;

    height:130px;

    border:none;

    border-radius:30px;

    color:white;

    font-size:50px;
}

#aBtn{
    background:#ff8800;
}

#bBtn{
    background:#00aa66;
}

.mode-row{

    display:flex;

    gap:20px;

    padding:20px;
}

.mode-btn{

    flex:1;

    height:130px;

    border:none;

    border-radius:30px;

    color:white;

    font-size:45px;
}

#normalBtn{
    background:#0f766e;
}

#smoothBtn{
    background:#7c3aed;
}

</style>
</head>

<body>

<h1>
🚗 micro:bit FPV Car
</h1>

<video
id="video"
autoplay
playsinline
muted>
</video>

<div id="status">
未接続
</div>

<button id="connectBtn">
BLE接続
</button>

<div class="control-grid">

<button id="up" class="ctrl">
▲
</button>

<button id="left" class="ctrl">
◀
</button>

<button id="down" class="ctrl">
▼
</button>

<button id="right" class="ctrl">
▶
</button>

</div>

<button id="stop">
STOP
</button>

<div class="speed-title">
SPEED
</div>

<div id="speedValue">
25
</div>

<div class="speed-row">

<button
id="minus"
class="speed-btn">
−
</button>

<button
id="plus"
class="speed-btn">
+
</button>

</div>

<input
type="range"
id="slider"
min="0"
max="60"
value="25">

<div class="ab-row">

<button
id="aBtn"
class="ab-btn">
A 高速
</button>

<button
id="bBtn"
class="ab-btn">
B 通常
</button>

</div>

<div class="mode-row">

<button
id="normalBtn"
class="mode-btn">
普通走行
</button>

<button
id="smoothBtn"
class="mode-btn">
滑らか走行
</button>

</div>

<script>

let uartTx = null;

const encoder =
new TextEncoder();

let speed = 25;

const statusDiv =
document.getElementById("status");

const speedValue =
document.getElementById("speedValue");

const slider =
document.getElementById("slider");

const video =
document.getElementById("video");

# -----------------------------------
# 背面カメラ開始
# -----------------------------------
async function startCamera(){

    try{

        const stream =
        await navigator.mediaDevices
        .getUserMedia({

            video:{
                facingMode:"environment"
            },

            audio:false
        });

        video.srcObject = stream;

    }catch(e){

        console.log(e);

    }
}

# -----------------------------------
# 速度表示更新
# -----------------------------------
function updateSpeed(){

    speedValue.innerText = speed;

    slider.value = speed;
}

# -----------------------------------
# BLE送信
# -----------------------------------
async function send(msg){

    if(!uartTx) return;

    try{

        await uartTx
        .writeValueWithoutResponse(
            encoder.encode(msg + "\n")
        );

    }catch(e){

        console.log(e);
    }
}

# -----------------------------------
# BLE接続
# -----------------------------------
document
.getElementById("connectBtn")
.addEventListener(
"click",
connectBLE
);

async function connectBLE(){

    try{

        const device =
        await navigator.bluetooth
        .requestDevice({

            filters:[
                {
                    namePrefix:"BBC"
                }
            ],

            optionalServices:[
                "6e400001-b5a3-f393-e0a9-e50e24dcca9e"
            ]
        });

        const server =
        await device.gatt.connect();

        const service =
        await server
        .getPrimaryService(
            "6e400001-b5a3-f393-e0a9-e50e24dcca9e"
        );

        uartTx =
        await service.getCharacteristic(
            "6e400002-b5a3-f393-e0a9-e50e24dcca9e"
        );

        statusDiv.innerText =
        "micro:bit 接続済み";

    }catch(e){

        console.log(e);

        statusDiv.innerText =
        "接続失敗";
    }
}

# -----------------------------------
# 押している間送信
# -----------------------------------
function holdButton(id,msg){

    const btn =
    document.getElementById(id);

    btn.addEventListener(
    "touchstart",
    async (e)=>{

        e.preventDefault();

        await send(msg);
    });

    btn.addEventListener(
    "touchend",
    async (e)=>{

        e.preventDefault();

        await send("S");
    });

    btn.addEventListener(
    "mousedown",
    async ()=>{

        await send(msg);
    });

    btn.addEventListener(
    "mouseup",
    async ()=>{

        await send("S");
    });
}

holdButton("up","F");
holdButton("down","B");
holdButton("left","L");
holdButton("right","R");

# -----------------------------------
# STOP
# -----------------------------------
document
.getElementById("stop")
.addEventListener(
"click",
async ()=>{

    await send("S");
});

# -----------------------------------
# SPEED +
# -----------------------------------
document
.getElementById("plus")
.addEventListener(
"click",
async ()=>{

    speed += 5;

    if(speed > 60){
        speed = 60;
    }

    updateSpeed();

    await send("SPD:" + speed);
});

# -----------------------------------
# SPEED -
# -----------------------------------
document
.getElementById("minus")
.addEventListener(
"click",
async ()=>{

    speed -= 5;

    if(speed < 0){
        speed = 0;
    }

    updateSpeed();

    await send("SPD:" + speed);
});

# -----------------------------------
# スライダー
# -----------------------------------
slider.addEventListener(
"input",
async ()=>{

    speed =
    parseInt(slider.value);

    updateSpeed();

    await send(
        "SPD:" + speed
    );
});

# -----------------------------------
# A 高速
# -----------------------------------
document
.getElementById("aBtn")
.addEventListener(
"click",
async ()=>{

    speed = 55;

    updateSpeed();

    await send("A");
});

# -----------------------------------
# B 通常
# -----------------------------------
document
.getElementById("bBtn")
.addEventListener(
"click",
async ()=>{

    speed = 25;

    updateSpeed();

    await send("B");
});

# -----------------------------------
# 普通モード
# -----------------------------------
document
.getElementById("normalBtn")
.addEventListener(
"click",
async ()=>{

    await send("MODE:N");
});

# -----------------------------------
# 滑らかモード
# -----------------------------------
document
.getElementById("smoothBtn")
.addEventListener(
"click",
async ()=>{

    await send("MODE:S");
});

# -----------------------------------
# 起動
# -----------------------------------
updateSpeed();

startCamera();

</script>

</body>
</html>
